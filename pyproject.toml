[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inomine"
description = "Mining filamentous (Inovirus) prophages and their pHVR regions from bacterial genomes"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Huiying Zhong"}]
keywords = ["bioinformatics", "bacteriophage", "inovirus", "filamentous phage",
            "prophage", "vibrio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/awingzhong/inomine"
Source = "https://github.com/awingzhong/inomine"
Issues = "https://github.com/awingzhong/inomine/issues"

[project.scripts]
inomine = "inomine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inomine = ["data/**/*.hmm"]

[tool.setuptools.dynamic]
version = {attr = "inomine.__version__"}
