{% set name = "imexscan" %}
{% set version = "0.1.0" %}
{% set owner = "awingzhong" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ owner }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: f9c3c2bece9440aef5bc14aba505340d0bea73768ba7c7fb3dd8b32b9a6a180f

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv
  entry_points:
    - imexscan = imexscan.cli:main
  run_exports:
    - {{ pin_subpackage('imexscan', max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
  run:
    - python >=3.9
    - prodigal
    - hmmer

test:
  imports:
    - imexscan
  commands:
    - imexscan --version
    - imexscan run --help
    - imexscan dif --help

about:
  home: https://github.com/{{ owner }}/{{ name }}
  license: MIT
  license_file: LICENSE
  summary: Mining filamentous (Inovirus) prophages and their pHVR regions from bacterial genomes
  dev_url: https://github.com/{{ owner }}/{{ name }}

extra:
  recipe-maintainers:
    - {{ owner }}
