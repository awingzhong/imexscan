{% set name = "imexscan" %}
{% set version = "0.1.0" %}
{% set owner = "awingzhong" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ owner }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: e5fed3cd99e02716ca020366a42c887aef9623dd3645544beb5fcf39496d84be

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vvv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=77
  run:
    - python >=3.9
    - prodigal
    - hmmer

test:
  imports:
    - imexscan
  commands:
    - imexscan --version
    - imexscan run --help
    - imexscan dif --help

about:
  home: https://github.com/{{ owner }}/{{ name }}
  license: MIT
  license_file: LICENSE
  summary: Mining filamentous (Inovirus) prophages and their pHVR regions from bacterial genomes
  dev_url: https://github.com/{{ owner }}/{{ name }}

extra:
  recipe-maintainers:
    - {{ owner }}
